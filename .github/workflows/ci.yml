# Continuous integration for sova-vis/OA-backend (Architecture report · Phase 6).
# The cheapest useful verification: type-check and build on every push/PR, so a
# change that doesn't compile can't reach Railway. No secrets required — tsc
# needs no environment.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Type-check
        run: npm run type-check
      - name: Build
        run: npm run build
